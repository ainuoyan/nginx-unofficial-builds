name: Build stable nginx
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replace_version:
        description: 'Replace assets of this exact stable version (leave empty for normal build)'
        type: string
        required: false
  schedule:
    - cron: '23 1,13 * * *'
permissions:
  contents: read
concurrency: stable-release
jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - id: upstream
        env:
          REPLACE_VERSION: ${{ inputs.replace_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 https://nginx.org/en/download.html -o download.html
          version=$(python3 -c 'import re; s=open("download.html").read().split("Stable version",1)[1].split("Legacy versions",1)[0]; print(re.search(r"nginx-(\d+\.\d+\.\d+)\.tar\.gz",s)[1])')
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if [[ -n "$REPLACE_VERSION" ]]; then
            [[ "$REPLACE_VERSION" == "$version" || "$REPLACE_VERSION" == "1.30.7" ]] || { echo "Unsupported replacement version"; exit 1; }
            version=$REPLACE_VERSION
            grep -Fxq "v$version" <<< "$tags"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          elif ! grep -Fxq "v$version" <<< "$tags"; then echo "version=$version" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: detect
    if: needs.detect.outputs.version != ''
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          mkdir out
          docker run --rm -v "$PWD/scripts:/scripts:ro" -v "$PWD/packaging:/packaging:ro" -v "$PWD/out:/out" alpine:3.22 sh /scripts/build.sh "$VERSION"
      - name: Verify deployment on native systemd
        run: sudo bash tests/deploy.sh out/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}
          path: out/*.tar.gz
          if-no-files-found: error
  publish:
    needs: [detect, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - working-directory: out
        env:
          REPLACE_VERSION: ${{ inputs.replace_version }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          files=("nginx-$VERSION-linux-x86_64.tar.gz" "nginx-$VERSION-linux-aarch64.tar.gz")
          sha256sum "${files[@]}" > SHA256SUMS
          if [[ -n "$REPLACE_VERSION" ]]; then
            gh release upload "v$VERSION" "${files[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "v$VERSION" "${files[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "nginx $VERSION" --notes "Unofficial static Linux builds from https://nginx.org/download/nginx-$VERSION.tar.gz"
